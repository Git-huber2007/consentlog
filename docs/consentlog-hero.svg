<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" fill="none">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" fill-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="#09090b" />
  <rect width="1200" height="420" fill="url(#dotGrid)" />
  <rect width="1200" height="420" fill="url(#heroGlow)" />

  <!-- Outer Rounded Border Box -->
  <rect x="20" y="20" width="1160" height="380" rx="16" stroke="#27272a" stroke-width="1.5" />
  <line x1="20" y1="398" x2="1180" y2="398" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Center Shield Icon -->
  <g transform="translate(600, 105)" filter="url(#shieldShadow)">
    <circle cx="0" cy="0" r="42" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <!-- Shield Outline -->
    <path d="M-18 -18 L18 -18 L18 2 C18 16 0 24 0 24 C0 24 -18 16 -18 2 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chain Links / Check Inside -->
    <path d="M-7 1 L-2 6 L9 -5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Title -->
  <text x="600" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    CONSENTLOG
  </text>

  <!-- Subtitle -->
  <text x="600" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#a1a1aa" letter-spacing="2.5" text-anchor="middle">
    INTELLIGENT ENTERPRISE CONSENT &amp; PREFERENCE GOVERNANCE PLATFORM
  </text>

  <!-- Description line -->
  <text x="600" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="middle">
    Tamper-Evident SHA-256 Ledger • Real-Time Microservice Verification • GDPR Article 17 DSAR Workflow
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(600, 325)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#10b981" />
      <text x="-62" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">SHA-256 Hash Chain</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#06b6d4" />
      <text x="-62" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">EDPB / CNIL SLA</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#8b5cf6" />
      <text x="-62" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">Signed Webhooks</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(360, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="-75" cy="0" r="4" fill="#f59e0b" />
      <text x="-62" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">Tracker Inventory</text>
    </g>
  </g>
</svg>

